name: Run unified FPL scraper

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM UTC daily
  workflow_dispatch:  # Allows manual triggering

jobs:
  run-fpl-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install chromium --with-deps

      - name: Run unified FPL scraper
        run: python fpl_scraper.py

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in data files"
            git status --porcelain data/
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Commit and push updates
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "67693914+oforiik@users.noreply.github.com"
          git config --local user.name "oforiik"
          
          # Add all CSV files in data directory
          git add data/*.csv
          
          # Create commit with timestamp and season info
          SEASON=$(python -c "
          from datetime import date
          current_date = date.today()
          current_year = current_date.year
          if current_date.month >= 8:
              season = f'{current_year}/{str(current_year + 1)[-2:]}'
          else:
              season = f'{current_year - 1}/{str(current_year)[-2:]}'
          print(season)
          ")
          
          git commit -m "Update FPL data for season ${SEASON} [$(date +'%Y-%m-%d %H:%M:%S UTC')]"
          
          # Pull and rebase to incorporate any remote changes
          git pull --rebase origin main || git pull --rebase origin master
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}