name: Run unified FPL scraper

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM UTC daily
  workflow_dispatch:  # Allows manual triggering

jobs:
  run-fpl-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: pip install playwright

      - name: Install Chromium with deps
        run: playwright install --with-deps chromium

      - name: Debug - Check current script
        run: git log -1 --oneline && grep -n "headless" fpl_scraper.py

      - name: Run unified FPL scraper
        run: python fpl_scraper.py

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in data files"
            git status --porcelain data/
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Commit and push updates
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "67693914+oforiik@users.noreply.github.com"
          git config --local user.name "oforiik"
          
          git add data/
          git commit -m "Update FPL data [$(date +'%Y-%m-%d %H:%M:%S UTC')]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: screenshot.png
          retention-days: 7